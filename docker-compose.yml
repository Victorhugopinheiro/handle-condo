# Coolify: Build pack Docker Compose, location docker-compose.yml.
# Public traffic goes to nginx:8080. The Next.js app is only on this network.
# Do not publish host ports. Coolify's proxy already owns 80 and 443.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
        NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?}
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY:?}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?}
      DATABASE_URL: ${DATABASE_URL:?}
      # One Coolify value. The app accepts either name.
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SECRET_KEY:?}
      RESIDENT_SESSION_SECRET: ${RESIDENT_SESSION_SECRET:?}
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  nginx:
    build:
      context: ./nginx
    depends_on:
      app:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      # Generated domain, routed to container port 8080. The value is the path.
      SERVICE_URL_NGINX_8080: /
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
